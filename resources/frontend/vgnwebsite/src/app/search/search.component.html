<div class="container-fluid p-0 m-0 mb-5" style="position: relative;">
    <picture>
        <source media="(max-width: 768px)"  srcset="https://cdn.vgn.in/nodeserver/website/banner/mobile/15.jpg">
        <source media="(min-width: 768px)"  srcset="https://cdn.vgn.in/nodeserver/website/banner/15.jpg">
        <img src="https://cdn.vgn.in/nodeserver/website/banner/mobile/15.jpg" alt="VGN" title="VGN" style="width:100%;min-height:480px;max-height:600px;height:auto;border-radius:0% 100% 0% 100% / 50% 0% 100% 15%;">
    </picture>
    <div class="text-center position-absolute ps-1" style="left:10px;top: 1rem;">
        <a routerLink="/home" class="cta-btn--parent">
        Home
        </a>
    </div>
    
    <div class=" centered banner_text">
      <h1 class="banner_text mb-4">Search Projects</h1>
      <form #searchData="ngForm" (ngSubmit)="search(searchData)">
        <div class="row mb-3">
          <div class="col-md-4 mb-2">
            <select class="form-select" name="Type"  [(ngModel)]="type">
              <option selected disabled>Project Type <i class="fa fa-caret-up fa-fw pull-right"></i></option>
              <option value="apartments">Apartments</option>
              <option value="plots">Plots</option>
            </select>
          </div>
          <div class="col-md-4 mb-2">
            <select class="form-select" name="Location"  [(ngModel)]="location">
              <option selected disabled>Location <i class="fa fa-caret-up fa-fw pull-right"></i></option>
              <option value="Ambattur">Ambattur</option>
              <option value="Anna Nagar">Anna Nagar</option>
              <option value="Guindy">Guindy</option>
              <option value="Muttukadu ECR">Muttukadu ECR</option>
              <option value="Nungambakkam">Nungambakkam</option>
              <option value="Pudupakkam">Pudupakkam</option>
              <option value="Tambaram">Tambaram</option>
              <option value="Thiruneermalai">Thiruneermalai</option>
              <option value="Thiruverkadu">Thiruverkadu</option>
            </select>
          </div>
          <div class="col-md-4 ">
            <select class="form-select" name="Startingrange"  [(ngModel)]="startingrange">
              <option selected disabled>Budget <i class="fa fa-caret-up fa-fw pull-right"></i></option>
              <option value="2000000">10 - 20 Lakhs</option>
              <option value="4000000">21 - 40 Lakhs</option>
              <option value="6000000">41 - 60 Lakhs</option>
              <option value="8000000">61 - 80 Lakhs</option>
              <option value="9900000">81 - 99 Lakhs</option>
              <option value="100000000">1 Crore Plus</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-dark">Search</button>
      </form>
    </div>
  </div>
  

  <div class="container-fluid  mt-3 p-0 pb-5 pt-3">
    <div class="container-lg d-flex flex-wrap ">
      <!-- <h1 class="h1_title mb-4">Ongoing</h1> -->
      <div class="row">
        <ng-container *ngFor='let list of completedURL'>
          <div class="col-md-3">
            <div class="card border-0 rounded  mb-4 project-card" >
                <img class="card-img-top mb-2" src="https://cdn.vgn.in/images/project_thumb/{{list.id}}.jpg" alt="{{list.Project_name}}">
                <div class="card-body p-0">
                    <ul class="list-group border-0 list-group-flush">
                        <li class="list-group-item rounded border-0 p-2"><p class="d-inline-block ms-3 m-0" >VGN {{list.Project_name}}</p></li>
                        <li class="list-group-item rounded border-0 p-2"><p class="d-inline-block ms-3 m-0"><i class="fa fa-map-marker d-inline-block me-3" aria-hidden="true"></i>{{list.Location}}</p></li>
                        <li class="list-group-item rounded border-0 p-2"><p class="d-inline-block ms-3 m-0"><i class="fa fa-building-o d-inline-block me-3" aria-hidden="true"></i>{{list.Type}}</p></li>
                        <!-- <li class="list-group-item rounded border-0 p-2"><p class="d-inline-block ms-3 m-0"><i class="fa fa-inr d-inline-block me-3" aria-hidden="true"></i>3.33 Crore Onwards*</p></li> -->
                        <li class="list-group-item rounded border-0 p-2 clearfix"><a class="d-inline-block ms-3 m-0 float-start view-more" href="/project/{{list.Project_name | replaceUnderscore | lowercase}}">View More<i class="material-icons align-middle ms-2">exit_to_app</i></a><a class="d-inline-block me-3 m-0 float-end" target="_blank" href="https://cdn.vgn.in/images/ebrochure/{{list.id}}/{{list.Project_name | replaceUnderscore | lowercase}}.pdf"><i class="material-icons align-middle me-2">system_update_alt</i>Brochure</a></li>
                    </ul>
                </div>
            </div>
          </div>   
        </ng-container>
      </div>
    </div>
  </div>
